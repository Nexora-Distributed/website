<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Authenticated clients access Nexora diagnostic tools through the API</title><style>
@keyframes flow { to { stroke-dashoffset: -140; } }
@keyframes signal { 0%,100% { opacity:1; } 50% { opacity:.38; } }
@keyframes draw { from { stroke-dashoffset:1100; } to { stroke-dashoffset:0; } }
g path[stroke-dasharray] { animation:flow 12s linear infinite; }
g circle { animation:signal 4s ease-in-out infinite; }
g circle:nth-of-type(2n) { animation-delay:1.2s; }
g path[stroke-width="3"] { stroke-dasharray:1100; animation:draw 3s ease-out both; }
#still:target ~ g * { animation:none!important; }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style><g id="still"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><rect x="50" y="100" width="270" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="72" cy="127" r="4" fill="#ffcc00"/><text x="88" y="133" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">MCP client</text><text x="72" y="162" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Cursor / Claude Desktop</text><g transform="translate(290 121) scale(0.5)" fill="none" stroke="#ffcc00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></g><rect x="50" y="420" width="270" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="72" cy="447" r="4" fill="#ffcc00"/><text x="88" y="453" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Nexora AI</text><text x="72" y="482" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Cluster-aware assistant</text><g transform="translate(290 441) scale(0.5)" fill="none" stroke="#ffcc00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></g><path d="M320 143H400V320H480M320 463H400V320M580 320H700" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><g transform="translate(480 270) scale(1.0)"><rect width="100" height="100" rx="26" fill="#ffcc00"/><path d="M31 39 50 50 69 39M50 50V70" fill="none" stroke="#242b20" stroke-wi
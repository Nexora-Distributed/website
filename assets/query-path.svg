<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">SQL exploration, execution planning and example results</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><rect x="65" y="80" width="420" height="250" rx="14" fill="#202820" stroke="#3b463c"/><text x="94" y="120" fill="#a4aea6" font-size="13" font-weight="600" text-anchor="start">QUERY.SQL</text><text x="94" y="174" fill="#ffcc00" font-size="22" font-weight="400" text-anchor="start">SELECT event_type, count()</text><text x="94" y="215" fill="#e9eee9" font-size="20" font-weight="400" text-anchor="start">FROM analytics.events</text><text x="94" y="256" fill="#e9eee9" font-size="20" font-weight="400" text-anchor="start">GROUP BY event_type;</text><path d="M485 205H630V375H730" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="560" y="110" width="300" height="160" rx="14" fill="#202720" stroke="#3b463c"/><text x="590" y="149" fill="#a4aea6" font-size="13" font-weight="600" text-anchor="start">EXECUTION PLAN</text><text x="590" y="190" fill="#e9eee9" font-size="16" font-weight="400" text-anchor="start">Read → Filter → Aggregate</text><text x="590" y="230" fill="#a4aea6" font-size="13" font-weight="400" text-anchor="start">Inspect the work behind SQL</text><rect x="330" y="390" width="530" height="175" rx="14" fill="#202720" stroke="#3b463c"/><text x="360" y="428" fill="#a4aea6" font-size="13" font-weight="600" text-anchor="start">RESULTS</text><path d="M360 451L830 451" stroke="#384535" stroke-width="1" fill="none" /><text x="360" y="477" fill="#e9eee9" font-size="15" font-weight="400" text-anchor="start">page_view</text><text x="830" y="477" fill="#ffcc00" font-size="15" font-weight="400" text-anchor="end">12,841</text><path d="M360 486L830 486" stroke="#384535" stroke-width="1" fill="none" /><text x="360" y="512" fill="#e9eee9" font-size="15" font-weight="400" text-anchor="start">purchase</text><text x="830" y="512" fill="#ffcc00" font-size="15" font-weight="400" text-anchor="end">1,208</text><path d="M360 521L830 521" stroke="#384535" stroke-width="1" fill="none" /><text x="360" y="547" fill="#e9eee9" font-size="15" font-weight="400" text-anchor="start">signup</text><text x="830" y="547" fill="#ffcc00" font-size="15" font-weight="400" text-anchor="end">486</text><text x="80" y="535" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">ILLUSTRATIVE</text><text x="80" y="557" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">SQL WORKFLOW</text></g></svg>
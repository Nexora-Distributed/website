<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Upgrade analysis, prechecks, operator review and maintenance planning</title><style>
@keyframes flow { to { stroke-dashoffset: -140; } }
@keyframes signal { 0%,100% { opacity:1; } 50% { opacity:.38; } }
@keyframes draw { from { stroke-dashoffset:1100; } to { stroke-dashoffset:0; } }
g path[stroke-dasharray] { animation:flow 12s linear infinite; }
g circle { animation:signal 4s ease-in-out infinite; }
g circle:nth-of-type(2n) { animation-delay:1.2s; }
g path[stroke-width="3"] { stroke-dasharray:1100; animation:draw 3s ease-out both; }
#still:target ~ g * { animation:none!important; }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style><g id="still"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><path d="M130 335H830" fill="none" stroke="#687b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="55" y="230" width="190" height="190" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="150" cy="230" r="8" fill="#ffcc00"/><text x="150" y="286" fill="#ffcc00" font-size="34" font-weight="600" text-anchor="middle">01</text><text x="150" y="335" fill="#e9eee9" font-size="20" font-weight="600" text-anchor="middle">Analyze</text><text x="150" y="375" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="middle">Version options</text><rect x="280" y="230" width="190" height="190" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="375" cy="230" r="8" fill="#ffcc00"/><text x="375" y="286" fill="#ffcc00" font-size="34" font-weight="600" text-anchor="middle">02</text><text x="375" y="335" fill="#e9eee9" font-size="20" font-weight="600" text-anchor="middle">Precheck</text><text x="375" y="375" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="middle">Environment checks</text><rect x="505" y="230" width="190" height="190" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="600" cy="230" r="8" fill="#ffcc00"/><text x="600" y="286" fill="#ffcc00" font-size="34" font-weight="600" text-anchor="middle">03</text><text x="600" y="335" fill="#e9eee9" font-size="20" font-weight="600" text-anchor="middle">Review</text><text x="600" y="375" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="middle">Operator decision</text><rect x="730" y="230" width="190" height="190" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="825" cy="230" r="8" fill="#ffcc00"/><text x="825" y="286" fill="#ffcc00" font-size="34" font-weight="600" text-anchor="middle">04</text><text x="825" y="335" fill="#e9eee9" font-size="20" font-weight="600" text-anchor="middle">Record</text><text x="825" y="375" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="middle">Plan &amp; maintenance</text><text x="480" y="490" fill="#a4aea6" font-size="14" font-weight="600" text-anchor="middle">A CLEAR PATH THROUGH THE CHANGE</text></g></svg>
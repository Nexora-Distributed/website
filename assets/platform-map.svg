<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Nexora platform capability map</title><style>
@keyframes flow { to { stroke-dashoffset: -140; } }
@keyframes signal { 0%,100% { opacity:1; } 50% { opacity:.38; } }
@keyframes draw { from { stroke-dashoffset:1100; } to { stroke-dashoffset:0; } }
g path[stroke-dasharray] { animation:flow 12s linear infinite; }
g circle { animation:signal 4s ease-in-out infinite; }
g circle:nth-of-type(2n) { animation-delay:1.2s; }
g path[stroke-width="3"] { stroke-dasharray:1100; animation:draw 3s ease-out both; }
#still:target ~ g * { animation:none!important; }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style><g id="still"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><path d="M210 148Q480 148 480 300" fill="none" stroke="#657650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="65" y="105" width="290" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="87" cy="132" r="4" fill="#ffcc00"/><text x="103" y="138" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">OBSERVABILITY</text><text x="87" y="167" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Metrics · queries · logs</text><path d="M750 148Q480 148 480 300" fill="none" stroke="#657650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="605" y="105" width="290" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="627" cy="132" r="4" fill="#ffcc00"/><text x="643" y="138" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">INTELLIGENCE</text><text x="627" y="167" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Assistant · advisors · scans</text><path d="M210 448Q480 448 480 300" fill="none" stroke="#657650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="65" y="405" width="290" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="87" cy="432" r="4" fill="#ffcc00"/><text x="103" y="438" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">DATA WORK</text><text x="87" y="467" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">SQL · schedules · health</text><path d="M750 448Q480 448 480 300" fill="none" stroke="#657650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="605" y="405" width="290" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="627" cy="432" r="4" fill="#ffcc00"/><text x="643" y="438" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">OPERATIONS</text><text x="627" y="467" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Backups · deploys · support</text><g transform="translate(430 250) scale(1.0)"><rect width="100" height="100" rx="26" fill="#ffcc00"/><path d="M31 39 50 50 69 39M50 50V70" fill="none" stroke="#242b20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="31" cy="34" r="10" fill="#242b20"/><circle cx="69" cy="34" r="10" fill="#242b20"/><circle cx="50" cy="73" r="10" fill="#242b20"/><circle cx="50" cy="50" r="5" fill="#242b20"/></g><text x="480" y="390" fill="#ffcc00" font-size="15" font-weight="600" text-anchor="middle">ONE CLUSTER CONTEXT</text><rect x="280" y="545" width="400" height="46" rx="14" fill="#202720" stroke="#3b463c"/><text x="480" y="575" fill="#a4aea6" font-size="13" font-weight="600" text-anchor="middle">IDENTITY / ACCESS / AUDIT</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Observe, plan, execute and review the operational workflow</title><style>
@keyframes flow { to { stroke-dashoffset: -140; } }
@keyframes signal { 0%,100% { opacity:1; } 50% { opacity:.38; } }
@keyframes draw { from { stroke-dashoffset:1100; } to { stroke-dashoffset:0; } }
g path[stroke-dasharray] { animation:flow 12s linear infinite; }
g circle { animation:signal 4s ease-in-out infinite; }
g circle:nth-of-type(2n) { animation-delay:1.2s; }
g path[stroke-width="3"] { stroke-dasharray:1100; animation:draw 3s ease-out both; }
#still:target ~ g * { animation:none!important; }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style><g id="still"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><circle cx="480" cy="320" r="205" fill="none" stroke="#506141" stroke-width="2" stroke-dasharray="6 10"/><g transform="translate(430 270) scale(1.0)"><rect width="100" height="100" rx="26" fill="#ffcc00"/><path d="M31 39 50 50 69 39M50 50V70" fill="none" stroke="#242b20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="31" cy="34" r="10" fill="#242b20"/><circle cx="69" cy="34" r="10" fill="#242b20"/><circle cx="50" cy="73" r="10" fill="#242b20"/><circle cx="50" cy="50" r="5" fill="#242b20"/></g><rect x="90" y="120" width="280" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="112" cy="147" r="4" fill="#ffcc00"/><text x="128" y="153" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Observe</text><text x="112" y="182" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Health &amp; telemetry</text><rect x="590" y="120" width="280" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="612" cy="147" r="4" fill="#ffcc00"/><text x="628" y="153" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Plan</text><text x="612" y="182" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Review &amp; prechecks</text><rect x="590" y="435" width="280" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="612" cy="462" r="4" fill="#ffcc00"/><text x="628" y="468" fill="#e9eee9" font-size="16" font-weight="600" text-ancho
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Invite-only SSO connects a user to scoped platform access</title><style>
@keyframes flow { to { stroke-dashoffset: -140; } }
@keyframes signal { 0%,100% { opacity:1; } 50% { opacity:.38; } }
@keyframes draw { from { stroke-dashoffset:1100; } to { stroke-dashoffset:0; } }
g path[stroke-dasharray] { animation:flow 12s linear infinite; }
g circle { animation:signal 4s ease-in-out infinite; }
g circle:nth-of-type(2n) { animation-delay:1.2s; }
g path[stroke-width="3"] { stroke-dasharray:1100; animation:draw 3s ease-out both; }
#still:target ~ g * { animation:none!important; }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style><g id="still"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><rect x="70" y="260" width="240" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="92" cy="287" r="4" fill="#ffcc00"/><text x="108" y="293" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Invited user</text><text x="92" y="322" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">An existing Nexora account</text><text x="292" y="293" fill="#ffcc00" font-size="12" font-weight="400" text-anchor="end">01</text><rect x="365" y="260" width="250" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="387" cy="287" r="4" fill="#ffcc00"/><text x="403" y="293" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Identity provider</text><text x="387" y="322" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">OIDC / OAuth2 / SAML / LDAP</text><text x="597" y="293" fill="#ffcc00" font-size="12" font-weight="400" text-anchor="end">02</text><rect x="670" y="260" width="230" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="692" cy="287" r="4" fill="#ffcc00"/><text x="708" y="293" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Scoped access</text><text x="692" y="322" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Roles &amp; cluster permissions</text><text x="882" y="293" fill="#ffcc00" font-size="12" font-weight="400" text-anchor="end">03</text><path d="M310 303H365M615 303H670" fill="none" stroke="
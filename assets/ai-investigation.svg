<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">A question becomes an evidence-based investigation</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><rect x="225" y="55" width="510" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="247" cy="82" r="4" fill="#ffcc00"/><text x="263" y="88" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Why is this cluster under pressure?</text><text x="247" y="117" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">A question in the context of your ClickHouse fleet</text><text x="717" y="88" fill="#ffcc00" font-size="12" font-weight="400" text-anchor="end">?</text><path d="M480 141V205M220 205H740M220 205V250M480 205V250M740 205V250" fill="none" stroke="#74875c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="80" y="250" width="240" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="102" cy="277" r="4" fill="#a8d5b5"/><text x="118" y="283" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Cluster health</text><text x="102" y="312" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Topology &amp; node vitals</text><text x="302" y="283" fill="#a8d5b5" font-size="12" font-weight="400" text-anchor="end">✓</text><rect x="340" y="250" width="240" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="362" cy="277" r="4" fill="#a8d5b5"/><text x="378" y="283" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Query evidence</text><text x="362" y="312" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Memory &amp; execution</text><text x="562" y="283" fill="#a8d5b5" font-size="12" font-weight="400" text-anchor="end">✓</text><rect x="600" y="250" width="240" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="622" cy="277" r="4" fill="#a8d5b5"/><text x="638" y="283" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Documentation</text><text x="622" y="312" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Configured source snapshots</text><text x="822" y="283" fill="#a8d5b5" font-size="12" font-weight="400" text-anchor="end">✓</text><path d="M200 336V395H720V336M460 395V450" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="225" y="450" width="510" height="125" rx="14" fill="#2a321c" stroke="#73804a"/><g transform="translate(247 474) scale(0.54)"><rect width="100" height="100" rx="26" fill="#ffcc00"/><path d="M31 39 50 50 69 39M50 50V70" fill="none" stroke="#242b20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="31" cy="34" r="10" fill="#242b20"/><circle cx="69" cy="34" r="10" fill="#242b20"/><circle cx="50" cy="73" r="10" fill="#242b20"/><circle cx="50" cy="50" r="5" fill="#242b20"/></g><text x="326" y="489" fill="#ffcc00" font-size="18" font-weight="600" text-anchor="start">Evidence → explanation → next step</text><text x="326" y="522" fill="#a4aea6" font-size="14" font-weight="400" text-anchor="start">An operator reviews the recommendation.</text><text x="326" y="549" fill="#a4aea6" font-size="11" font-weight="400" text-anchor="start">ILLUSTRATIVE INVESTIGATION</text></g></svg>
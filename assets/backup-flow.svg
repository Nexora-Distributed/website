<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Full and incremental backup chains with a restore path</title><style>
@keyframes flow { to { stroke-dashoffset: -140; } }
@keyframes signal { 0%,100% { opacity:1; } 50% { opacity:.38; } }
@keyframes draw { from { stroke-dashoffset:1100; } to { stroke-dashoffset:0; } }
g path[stroke-dasharray] { animation:flow 12s linear infinite; }
g circle { animation:signal 4s ease-in-out infinite; }
g circle:nth-of-type(2n) { animation-delay:1.2s; }
g path[stroke-width="3"] { stroke-dasharray:1100; animation:draw 3s ease-out both; }
#still:target ~ g * { animation:none!important; }
@media(prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style><g id="still"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(70 245)"><path d="M0 20V116C0 144 150 144 150 116V20" fill="#263126" stroke="#67795e" stroke-width="2"/><ellipse cx="75" cy="20" rx="75" ry="24" fill="#37452e" stroke="#67795e" stroke-width="2"/><path d="M0 66C0 94 150 94 150 66" fill="none" stroke="#67795e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="115" fill="#edf0e9" font-size="14" font-weight="600" text-anchor="middle">ClickHouse</text></g><path d="M220 310H340M340 160V460M340 160H450M340 460H450" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="450" y="115" width="260" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="472" cy="142" r="4" fill="#ffcc00"/><text x="488" y="148" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Full backup</text><text x="472" y="177" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">The recovery baseline</text><text x="692" y="148" fill="#ffcc00" font-size="12" font-weight="400" text-anchor="end">01</text><rect x="450" y="415" width="260" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="472" cy="442" r="4" fill="#ffcc00"/><text x="488" y="448" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Incremental</text><text x="472" y="477" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Changes in the chain</text><g transform="translate(680 436) scale(0.5)" fill="none" stroke="#ffcc00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><path d="M710 158H795V455H710" fill="none" stroke="#a8d5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="740" y="250" width="160" height="110" rx="14" fill="#273323" stroke="#6c8252"/><text x="820" y="295" fill="#ffcc00" font-size="14" font-weight="600" text-anchor="middle">STORAGE</text><text x="820" y="328" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="middle">Your destination</text><path d="M800 505V565H145V400" fill="none" stroke="#91a8a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><text x="470" y="594" fill="#a4aea6" font-size="13" font-weight="600" text-anchor="middle">RESTORE / RECOVERY WORKFLOW</text></g></svg>
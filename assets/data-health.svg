<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">Dataset health checks for freshness, completeness and schema</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9eb295" stroke-opacity=".055"/></pattern><radialGradient id="glow"><stop stop-color="#a3b76a" stop-opacity=".13"/><stop offset="1" stop-color="#151b16" stop-opacity="0"/></radialGradient></defs><rect width="960" height="640" fill="#151b16"/><rect width="960" height="640" fill="url(#grid)"/><ellipse cx="480" cy="310" rx="440" ry="290" fill="url(#glow)"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(50 255)"><path d="M0 20V116C0 144 150 144 150 116V20" fill="#263126" stroke="#67795e" stroke-width="2"/><ellipse cx="75" cy="20" rx="75" ry="24" fill="#37452e" stroke="#67795e" stroke-width="2"/><path d="M0 66C0 94 150 94 150 66" fill="none" stroke="#67795e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="75" y="115" fill="#edf0e9" font-size="14" font-weight="600" text-anchor="middle">Dataset</text></g><path d="M200 320H310M650 320H780" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9"/><rect x="310" y="100" width="340" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="332" cy="127" r="4" fill="#a8d5b5"/><text x="348" y="133" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Freshness</text><text x="332" y="162" fill="#a4aea6" font-size="12" font-weight="400" text-anchor="start">Is the dataset up to date?</text><text x="632" y="133" fill="#a8d5b5" font-size="12" font-weight="400" text-anchor="end">✓</text><rect x="310" y="255" width="340" height="86" rx="14" fill="#202720" stroke="#3b463c"/><circle cx="332" cy="282" r="4" fill="#a8d5b5"/><text x="348" y="288" fill="#e9eee9" font-size="16" font-weight="600" text-anchor="start">Co